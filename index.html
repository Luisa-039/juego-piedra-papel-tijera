<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="icon" href="../img/juego.png" type="image/x-icon">
    <title>Piedra Papel y Tijera</title>
</head>

<body>
    <section class="container">
        <div class="campo_resultados">
            <div class="resultados_imagenes">
                <span class="user_resultados">
                    <img src="img/piedra.png" alt="Imagen piedra">
                </span>
                <span class="pc_resultados">
                    <img src="img/piedra.png" alt="Imagen piedra">
                </span>
            </div>
            <div class="resultados">
                ¡¡Juguemos!!
            </div>
            <div class="resultados">
                <select id="dificultad">
                    <option value="facil">Fácil</option>
                    <option value="medio">Medio</option>
                    <option value="dificil">Difícil</option>
                </select>
            </div>            
        </div>

        <div class="opciones_imagenes">
            <span class="opcion_imagen">
                <img src="img/piedra.png" alt="Imagen piedra">
                <p>Piedra</p>
            </span>
            <span class="opcion_imagen">
                <img src="img/papel.png" alt="Imagen Papel">
                <p>Papel</p>
            </span>
            <span class="opcion_imagen">
                <img src="img/tijera.png" alt="Imagen Tijera">
                <p>Tijera</p>
            </span>
        </div>
    </section>
    
    <script src="js/micodigo.js"></script>
</body>

</html>
